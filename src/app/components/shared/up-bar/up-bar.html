<div class="bg-white shadow-sm border-b border-gray-100 sticky top-0 z-10 backdrop-blur-sm bg-white/90">
    <div class="max-w-[95%] xl:max-w-[1600px] 2xl:max-w-[1800px] mx-auto px-4 sm:px-6 lg:px-12 xl:px-16 py-3 sm:py-4">
        <div class="flex justify-between items-center">
            <button routerLink="/principal-page"
                class="flex items-center gap-1 sm:gap-2 text-gray-600 hover:text-emerald-600 transition-colors font-medium text-sm sm:text-base">
                <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
                <span class="hidden sm:inline">{{ translationService.t().back }}</span>
            </button>
            <div class="flex items-center gap-2 sm:gap-3">
                <span class="text-xs sm:text-sm text-gray-500 hidden sm:inline">{{ translationService.t().language }}</span>
                <button
                    (click)="toggleLanguage()"
                    class="bg-emerald-600 text-white px-3 sm:px-4 py-1 sm:py-1.5 rounded-full text-xs sm:text-sm font-medium hover:bg-emerald-700 transition-colors shadow-sm">
                    {{ currentLanguageLabel }}
                </button>
            </div>
        </div>
    </div>
</div>
