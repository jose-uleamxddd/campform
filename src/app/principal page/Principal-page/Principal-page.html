<div
    class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden bg-gradient-to-br from-slate-50 to-slate-100">

    <!-- Animated Background Elements -->
    <div class="absolute inset-0 z-0">
        <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-purple-300/40 rounded-full blur-3xl animate-float">
        </div>
        <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-blue-300/40 rounded-full blur-3xl animate-float"
            style="animation-delay: -3s;"></div>
    </div>

    <!-- Main Card -->
    <div
        class="glass-card w-full max-w-lg p-8 sm:p-12 relative z-10 text-center bg-white/60 border-white/80 shadow-2xl">

        <!-- Header -->
        <div class="mb-10">
            <h1 class="text-4xl sm:text-5xl font-extrabold text-slate-800 mb-3 tracking-tight">
                CrossWorlds <span
                    class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600">Camps</span>
            </h1>
            <p class="text-slate-600 text-lg font-light">Select your church to begin registration</p>
        </div>

        <!-- Navigation Buttons -->
        <div class="space-y-4">
            <!-- Manantial -->
            <button (click)="navigateToManantial()"
                class="group w-full relative overflow-hidden rounded-xl bg-white border border-teal-100 p-4 transition-all duration-300 hover:scale-[1.02] hover:shadow-lg hover:shadow-teal-500/10 hover:border-teal-300">
                <div class="flex items-center justify-center gap-4">
                    <div class="p-2 bg-teal-50 rounded-lg group-hover:bg-teal-100 transition-colors">
                        <svg class="w-6 h-6 text-teal-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                        </svg>
                    </div>
                    <span class="text-lg font-semibold text-teal-800">Iglesia Manantial de Vida</span>
                </div>
            </button>

            <!-- Verbo -->
            <button (click)="navigateToVerbo()"
                class="group w-full relative overflow-hidden rounded-xl bg-white border border-blue-100 p-4 transition-all duration-300 hover:scale-[1.02] hover:shadow-lg hover:shadow-blue-500/10 hover:border-blue-300">
                <div class="flex items-center justify-center gap-4">
                    <div class="p-2 bg-blue-50 rounded-lg group-hover:bg-blue-100 transition-colors">
                        <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M8 14v3m4-3v3m4-3v3M3 21h18M3 10h18M3 7l9-4 9 4M4 10h16v11H4V10z" />
                        </svg>
                    </div>
                    <span class="text-lg font-semibold text-blue-800">Iglesia Verbo</span>
                </div>
            </button>

            <!-- Crossworlds Connection -->
            <button (click)="navigateToCrossworlds()"
                class="group w-full relative overflow-hidden rounded-xl bg-white border border-purple-100 p-4 transition-all duration-300 hover:scale-[1.02] hover:shadow-lg hover:shadow-purple-500/10 hover:border-purple-300">
                <div class="flex items-center justify-center gap-4">
                    <div class="p-2 bg-purple-50 rounded-lg group-hover:bg-purple-100 transition-colors">
                        <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
                        </svg>
                    </div>
                    <span class="text-lg font-semibold text-purple-800">Crossworlds Connection</span>
                </div>
            </button>

            <!-- Admin Link -->
            <div class="pt-6">
                <button (click)="navigateToAdmin()"
                    class="text-sm text-slate-500 hover:text-slate-800 transition-colors flex items-center justify-center gap-2 w-full">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                    Employee Access
                </button>
            </div>
        </div>

        <!-- Footer -->
        <p class="mt-8 text-xs text-slate-400">
            © 2026 CrossWorlds Camps. All rights reserved.
        </p>
    </div>
</div>
